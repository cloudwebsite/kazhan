name: 运行故障
description: 装好之后：打不开站、发卡异常、订单/会员/后台报错
title: "[故障] "
body:
  - type: markdown
    attributes:
      value: |
        描述「期望」和「实际」即可。**不要**粘贴卡密、买家联系方式、支付密钥、数据库密码、后台账号。
  - type: input
    id: version
    attributes:
      label: 版本号
      placeholder: v1.0.18
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 出问题的位置
      options:
        - 商城前台
        - 管理后台
        - 发卡 / 查单
        - 订单或退款
        - 会员 / 钱包
        - 主题
        - 通知（邮件 / Telegram 等）
        - 其它
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: 前台主题（仅前台问题填写）
      placeholder: Classic / 极速发卡 / 未知
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附上打码后的报错原文、订单状态、浏览器或服务日志片段。
    validations:
      required: true
